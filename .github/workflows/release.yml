
name: Release

# The one button to press to publish a version.
#
# What it does, in this order:
#   1. bump the version in package.json and in the manifest — both `version` and
#      the tag inside `docker_image` — so the three always agree;
#   2. move the `## [Unreleased]` section of CHANGELOG.md under the new version;
#   3. commit that, create the `vX.Y.Z` tag and push it;
#   4. call Build, which produces the multi-arch image on ghcr.io;
#   5. publish the GitHub Release of the tag, using the changelog section as its
#      notes — the Gladys supervision page links every version to it.
#
# WHY THE VERSION IS BUMPED IN THREE PLACES AND NEVER BY HAND
# The indexer serves whatever the manifest says, and Gladys pulls whatever tag
# the manifest names. A half-bumped version is not an error anyone sees: it is
# simply the old version still being offered to every user. One workflow writing
# all three removes that whole class of mistake.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the changelog and the tags are all there.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump the version and the changelog
        id: release
        run: node .github/scripts/release.mjs ${{ inputs.bump }}

      - name: Commit, tag and push
        run: |
          git add package.json gladys-assistant-integration.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.release.outputs.version }}"
          git tag "v${{ steps.release.outputs.version }}"
          git push
          git push --tags

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}"

  build:
    needs: release
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
