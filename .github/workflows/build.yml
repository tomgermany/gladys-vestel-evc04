name: Build

# Multi-architecture build of the integration image.
#
# THREE WAYS IN
#   workflow_dispatch  a manual run: builds the image for the branch you pick and
#                      tags it with that branch name, so it can be installed for
#                      testing without touching any published version.
#   push: tags         a version tag: builds the released image.
#   workflow_call      the Release workflow calls this once it has bumped the
#                      version and created the tag.
#
# RELEASE TAGS
# A release build (workflow_call from release.yml) publishes both the versioned
# tag and `latest`. This lets Gladys install/update the integration through the
# stable manifest tag. Manual branch builds and direct version-tag builds remain
# single-tag builds, so test builds never move `latest`.
#
# THE MANUAL TAG
# It defaults to the branch name, so `fix-netz` produces
# `ghcr.io/<owner>/<repo>:fix-netz`. Characters a tag cannot carry are folded to
# `-`; branch names with slashes are common and would otherwise produce an
# invalid reference.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build (defaults to the branch name)
        required: false
        type: string
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      version:
        description: Version being built and tagged
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One step decides the tag, so the build below has a single value to use
      # and the log states which one it picked.
      - name: Work out the image tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Called by the Release workflow: the version it just created.
            tag="${{ inputs.version }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            # Manual run with a tag typed in.
            tag="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A version tag was pushed: v1.2.3 -> 1.2.3
            tag="${GITHUB_REF_NAME#v}"
          else
            # Manual run with the field left empty: the branch name.
            tag="${GITHUB_REF_NAME}"
          fi
          # An image tag may hold letters, digits, dots, dashes and underscores.
          # A branch name may hold more, so anything else becomes a dash.
          tag="$(printf '%s' "$tag" | tr -c 'A-Za-z0-9._-' '-')"
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          # Only the Release workflow sets inputs.version. In that case, publish
          # latest alongside the immutable version tag. Manual/test builds do not.
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:$tag"
            if [ -n "${{ inputs.version }}" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building image tag: $tag"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Release builds receive two tags; all other build paths receive one.
          tags: ${{ steps.tag.outputs.tags }}
