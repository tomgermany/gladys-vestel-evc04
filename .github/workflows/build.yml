      - name: Image-Referenz bestimmen
        id: ref
        run: |
          manifest_tag="$(node -p 'require("./gladys-assistant-integration.json").docker_image.split(":").pop()')"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then tag="$manifest_tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baue ghcr.io/${{ github.repository }}:$tag"
