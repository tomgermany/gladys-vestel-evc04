name: Build

# Ein mehrarchitektonisches Image, ohne bewegliches `latest`.
#
# ZWEI WEGE HINEIN, UND WARUM ES NICHT DREI SIND
#   workflow_call      von release.yml aufgerufen, mit dem Tag, den es gerade setzt
#   workflow_dispatch  ein manueller Lauf, mit wahlweisem Tag — zum Testen
#
# `push: tags` stand hier einmal und ist ABSICHTLICH entfernt. Ein Tag, der aus
# einem GITHUB_TOKEN heraus gepusht wird, löst Workflows nicht zuverlässig aus: der
# Release-Lauf war grün, es gab ein Release, und dieser Workflow hat nie begonnen.
# Ein Aufruf ist ein Aufruf — auf den kann man sich verlassen.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image-Tag (Standard: Version aus dem Manifest)
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Image-Tag, den release.yml gerade erzeugt hat
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('v{0}', inputs.tag) || '' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tag bestimmen
        id: ref
        run: |
          manifest_tag="$(node -p 'require("./gladys-assistant-integration.json").docker_image.split(":").pop()')"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="$manifest_tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baue ghcr.io/${{ github.repository }}:$tag"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.ref.outputs.tag }}
